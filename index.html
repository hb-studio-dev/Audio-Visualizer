<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b12" />
    <title>Audio Visualizer Template</title>
    <link rel="stylesheet" href="./styles.css?v=fast-audio-v1" />
  </head>
  <body>
    <main id="visualizerRoot" aria-label="Audio visualizer">
      <div id="visualizerMount"></div>
      <div id="sourceScreen" class="source-screen">
        <div class="source-card">
          <h1>AUDIO SOURCE</h1>
          <div id="permissionStep" class="source-step">
            <p class="source-instructions">Please allow microphone access to continue.</p>
            <p id="permissionStatus" class="status" role="status" aria-live="polite">
              Waiting for microphone permission…
            </p>
            <button id="retryPermissionButton" class="primary" type="button" hidden>
              ALLOW MICROPHONE
            </button>
          </div>
          <div id="deviceSelectionStep" class="source-step" hidden>
            <p class="source-instructions">Select an audio input device.</p>
            <label for="initialDeviceSelect">INPUT DEVICE</label>
            <select id="initialDeviceSelect" disabled>
              <option>Loading audio inputs…</option>
            </select>
            <button id="setSourceButton" class="primary" type="button" disabled>SET</button>
            <p id="sourceStatus" class="status" role="status" aria-live="polite"></p>
          </div>
        </div>
      </div>
      <div id="menuHotspot" class="menu-hotspot">
        <button
          id="fullscreenButton"
          class="fullscreen-button"
          type="button"
          aria-label="Enter fullscreen"
          title="Enter fullscreen"
          aria-pressed="false"
        >
          <svg
            class="fullscreen-enter"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" />
          </svg>
          <svg
            class="fullscreen-exit"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9h6V3M21 9h-6V3M3 15h6v6M21 15h-6v6" />
          </svg>
        </button>
        <button
          id="menuButton"
          class="hamburger"
          aria-expanded="false"
          aria-controls="settingsPanel"
          aria-label="Open settings"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
      <div id="settingsBackdrop" class="backdrop" hidden></div>
      <aside
        id="settingsPanel"
        class="settings-panel"
        aria-label="Visualizer settings"
        aria-hidden="true"
        inert
      >
        <div class="panel-top">
          <h2>SETTINGS</h2>
          <button
            id="closeSettingsButton"
            aria-label="Close settings"
            class="close-button"
          >
            ×
          </button>
        </div>
        <section>
          <h3>AUDIO SOURCE</h3>
          <label for="settingsDeviceSelect">Input device</label>
          <select id="settingsDeviceSelect"></select>
          <button id="applySourceButton">SWITCH SOURCE</button>
          <p id="settingsStatus" class="status" role="status"></p>
        </section>
        <section id="controlsSection">
          <h3>AUDIO ANALYSIS</h3>
          <div id="analysisControls"></div>
        </section>
        <button id="resetSettingsButton" class="reset-button">
          RESET ANALYSIS SETTINGS
        </button>
      </aside>
    </main>
    <script type="module" src="./main.js?v=fast-audio-v1"></script>
  </body>
</html>
